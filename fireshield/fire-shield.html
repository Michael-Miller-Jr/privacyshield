<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Privacy Firewall — Icon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            background: #0f0f12;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .icon-wrap {
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* flame flicker */
        .flame-outer {
            animation: flickerOuter 1.6s ease-in-out infinite;
            transform-origin: 160px 250px;
        }

        .flame-mid {
            animation: flickerMid 1.3s ease-in-out infinite;
            transform-origin: 160px 250px;
        }

        .flame-inner {
            animation: flickerInner 1.0s ease-in-out infinite;
            transform-origin: 160px 250px;
        }

        @keyframes flickerOuter {
            0%, 100% {
                transform: scale(1) translateY(0);
            }

            50% {
                transform: scale(1.04) translateY(-3px);
            }
        }

        @keyframes flickerMid {
            0%, 100% {
                transform: scale(1) translateY(0);
            }

            50% {
                transform: scale(0.97) translateY(2px);
            }
        }

        @keyframes flickerInner {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.06) translateY(-1px);
            }
        }
    </style>
</head>
<body>
    <div class="icon-wrap">
        <svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#3b82f6" />
                    <stop offset="100%" stop-color="#1e40af" />
                </linearGradient>
                <linearGradient id="flameOuter" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffd23f" />
                    <stop offset="55%" stop-color="#ff7a18" />
                    <stop offset="100%" stop-color="#c72f0a" />
                </linearGradient>
                <linearGradient id="flameMid" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#fff4b8" />
                    <stop offset="60%" stop-color="#ffb238" />
                    <stop offset="100%" stop-color="#ff5e1e" />
                </linearGradient>
                <linearGradient id="flameInner" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="70%" stop-color="#ffe066" />
                    <stop offset="100%" stop-color="#ffb238" />
                </linearGradient>
            </defs>

            <!-- outer flame -->
            <path class="flame-outer"
                  d="M160 60
           C 196 100, 232 130, 232 178
           C 232 224, 200 258, 160 258
           C 120 258, 88 224, 88 178
           C 88 140, 112 118, 128 96
           C 132 118, 140 128, 150 132
           C 146 108, 150 82, 160 60 Z"
                  fill="url(#flameOuter)"
                  opacity="0.95" />

            <!-- mid flame -->
            <path class="flame-mid"
                  d="M160 104
           C 184 130, 206 152, 206 184
           C 206 216, 186 238, 160 238
           C 134 238, 114 216, 114 184
           C 114 158, 130 144, 140 128
           C 144 144, 150 150, 156 152
           C 152 136, 154 118, 160 104 Z"
                  fill="url(#flameMid)" />

            <!-- inner flame -->
            <path class="flame-inner"
                  d="M160 150
           C 174 166, 188 180, 188 198
           C 188 216, 176 228, 160 228
           C 144 228, 132 216, 132 198
           C 132 182, 142 172, 150 162
           C 152 170, 156 174, 160 176
           C 158 168, 158 158, 160 150 Z"
                  fill="url(#flameInner)" />

            <!-- blue shield overlay -->
            <g>
                <path d="M160 118
             L 222 142
             L 222 188
             C 222 224, 194 246, 160 258
             C 126 246, 98 224, 98 188
             L 98 142 Z"
                      fill="url(#shieldGrad)"
                      stroke="#0b1f4d"
                      stroke-width="4"
                      stroke-linejoin="round"
                      opacity="0.92" />
                <!-- shield highlight -->
                <path d="M160 132
             L 208 150
             L 208 186
             C 208 214, 188 232, 160 242
             C 132 232, 112 214, 112 186
             L 112 150 Z"
                      fill="none"
                      stroke="#60a5fa"
                      stroke-width="2"
                      stroke-linejoin="round"
                      opacity="0.6" />
                <!-- checkmark -->
                <path d="M138 190 L 154 206 L 186 172"
                      fill="none"
                      stroke="#eaf2ff"
                      stroke-width="8"
                      stroke-linecap="round"
                      stroke-linejoin="round" />
            </g>
        </svg>
    </div>
</body>
</html>
