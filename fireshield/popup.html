<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="brand">
            <span class="shield-icon" aria-hidden="true">
                <svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#6366f1" />
                            <stop offset="100%" stop-color="#4f46e5" />
                        </linearGradient>
                        <linearGradient id="flameOuter" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#ffd23f" />
                            <stop offset="55%" stop-color="#ff7a18" />
                            <stop offset="100%" stop-color="#c72f0a" />
                        </linearGradient>
                        <linearGradient id="flameMid" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#fff4b8" />
                            <stop offset="60%" stop-color="#ffb238" />
                            <stop offset="100%" stop-color="#ff5e1e" />
                        </linearGradient>
                        <linearGradient id="flameInner" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#ffffff" />
                            <stop offset="70%" stop-color="#ffe066" />
                            <stop offset="100%" stop-color="#ffb238" />
                        </linearGradient>
                    </defs>
                    <path class="flame-outer" d="M160 60 C 196 100, 232 130, 232 178 C 232 224, 200 258, 160 258 C 120 258, 88 224, 88 178 C 88 140, 112 118, 128 96 C 132 118, 140 128, 150 132 C 146 108, 150 82, 160 60 Z" fill="url(#flameOuter)" opacity="0.95" />
                    <path class="flame-mid" d="M160 104 C 184 130, 206 152, 206 184 C 206 216, 186 238, 160 238 C 134 238, 114 216, 114 184 C 114 158, 130 144, 140 128 C 144 144, 150 150, 156 152 C 152 136, 154 118, 160 104 Z" fill="url(#flameMid)" />
                    <path class="flame-inner" d="M160 150 C 174 166, 188 180, 188 198 C 188 216, 176 228, 160 228 C 144 228, 132 216, 132 198 C 132 182, 142 172, 150 162 C 152 170, 156 174, 160 176 C 158 168, 158 158, 160 150 Z" fill="url(#flameInner)" />
                    <g>
                        <path d="M160 118 L 222 142 L 222 188 C 222 224, 194 246, 160 258 C 126 246, 98 224, 98 188 L 98 142 Z" fill="url(#shieldGrad)" stroke="#312e81" stroke-width="4" stroke-linejoin="round" opacity="0.92" />
                        <path d="M160 132 L 208 150 L 208 186 C 208 214, 188 232, 160 242 C 132 232, 112 214, 112 186 L 112 150 Z" fill="none" stroke="#818cf8" stroke-width="2" stroke-linejoin="round" opacity="0.6" />
                        <path d="M138 190 L 154 206 L 186 172" fill="none" stroke="#e0e7ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
                    </g>
                </svg>
            </span>
            <div class="brand-text">
                <h1>Privacy Shield</h1>
                <span class="status" id="status">
                    <span class="dot"></span><span id="statusText">Protection is on</span>
                </span>
            </div>
        </div>
        <button id="themeToggle" class="icon-btn" title="Toggle Theme">☀</button>
    </div>

    <!-- Master Switch Card -->
    <div class="card">
        <div class="card-row">
            <div>
                <div class="card-title">Block AI Leaks</div>
                <div class="card-subtitle">Prevents raw data leaks</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="killSwitch" checked> <!-- checked = PROTECTING (inverted in JS) -->
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- Advanced / Policies Card -->
    <div class="card">
        <div class="field-policy">
            <span class="fname">Email</span>
            <select data-field="email">
                <option value="rehydrate">Tokenize + restore</option>
                <option value="block">Block entirely</option>
                <option value="passthrough">Pass through</option>
            </select>
        </div>
        <div class="field-policy">
            <span class="fname">Phone</span>
            <select data-field="phone">
                <option value="rehydrate">Tokenize + restore</option>
                <option value="block">Block entirely</option>
                <option value="passthrough">Pass through</option>
            </select>
        </div>
        <div class="field-policy">
            <span class="fname">Full Name</span>
            <select data-field="name">
                <option value="passthrough">Pass through</option>
                <option value="rehydrate">Tokenize + restore</option>
                <option value="block">Block entirely</option>
            </select>
        </div>
        <div class="field-policy">
            <span class="fname">National ID</span>
            <select data-field="national_id">
                <option value="block">Block entirely</option>
                <option value="rehydrate">Tokenize + restore</option>
                <option value="passthrough">Pass through</option>
            </select>
        </div>
    </div>

    <!-- Allow / Disable Button -->
    <div class="card allow-card">
        <button class="btn-primary" id="allowBtn" title="Turns off protection for this specific website">
            Disable on <span id="hostDisplay">this site</span>
        </button>
    </div>

    <!-- Footer -->
    <div class="footer">
        <div class="footer-bottom">
            <span class="status-pill"><span class="dot"></span> Active on all sites</span>
            <span class="footer-links">
                <a href="#" id="testLink">Test</a>
                <span style="color: var(--border); margin: 0 6px;">|</span>
                <span class="version">v1.3</span>
            </span>
        </div>
        <div class="copyright-footer">
            &copy; <span id="copyright-year">2025</span>
            <a href="https://github.com/Michael-Miller-Jr" target="_blank" rel="noopener noreferrer">Michael Miller Jr.</a>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="popup.js"></script>
</body>
</html>
